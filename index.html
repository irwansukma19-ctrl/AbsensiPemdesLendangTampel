<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Pemdes Lendang Tampel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (V8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .fingerprint-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen relative">

    <!-- === TAMPILAN PUBLIK (PEGAWAI) === -->
    <div id="viewPublik" class="block pb-24">
        <!-- Hero Section (Kepala Desa) -->
        <div class="bg-slate-900 text-white p-6 shadow-xl rounded-b-[2.5rem] relative overflow-hidden">
            <div class="absolute top-4 right-4 z-20">
                <button onclick="bukaModalLogin()" class="text-slate-400 hover:text-white transition p-2">
                    <i class="fas fa-lock text-xl"></i>
                </button>
            </div>
            
            <div class="relative z-10 flex flex-col items-center text-center mt-4">
                <div class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-teal-500 p-1 mb-4 shadow-2xl relative">
                    <img id="fotoKadesPublik" src="https://ui-avatars.com/api/?name=Kades&background=0D8ABC&color=fff" class="w-full h-full rounded-full object-cover">
                    <div class="absolute -bottom-2 bg-teal-500 text-white text-xs font-bold px-3 py-1 rounded-full left-1/2 transform -translate-x-1/2 whitespace-nowrap">
                        Kepala Desa
                    </div>
                </div>
                <h1 class="text-2xl font-bold tracking-wide">PEMDES LENDANG TAMPEL</h1>
                <p class="text-slate-300 text-sm mt-2 italic">"Melayani dengan Hati & Disiplin"</p>
            </div>
        </div>

        <div class="p-4 mt-4">
            <h2 class="font-bold text-slate-700 mb-3 ml-2"><i class="fas fa-users text-teal-600 mr-2"></i>Pilih Profil Anda</h2>
            
            <!-- Carousel Pegawai -->
            <div id="carouselPegawai" class="flex overflow-x-auto hide-scroll space-x-3 pb-4 px-2">
                <p class="text-sm text-slate-400 italic" id="teksLoadingPegawai">Memuat data pegawai...</p>
                <!-- Card Pegawai di-render via JS -->
            </div>

            <!-- Action Area -->
            <div id="actionArea" class="hidden mt-4 bg-white p-6 rounded-3xl shadow-lg border border-slate-100 text-center">
                <img id="fotoTerpilih" src="" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover shadow-md border-2 border-slate-100">
                <h3 id="namaTerpilih" class="text-xl font-bold text-slate-800">Nama</h3>
                <p id="jabatanTerpilih" class="text-xs font-semibold text-teal-700 bg-teal-50 inline-block px-3 py-1 rounded-full mt-1 mb-6">Jabatan</p>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <button onclick="siapkanAbsen('Masuk')" class="bg-teal-600 text-white py-3 rounded-2xl font-bold shadow-md hover:bg-teal-700 transition flex flex-col items-center justify-center">
                        <i class="fas fa-sign-in-alt mb-1 text-xl"></i> Masuk
                    </button>
                    <button onclick="siapkanAbsen('Pulang')" class="bg-rose-500 text-white py-3 rounded-2xl font-bold shadow-md hover:bg-rose-600 transition flex flex-col items-center justify-center">
                        <i class="fas fa-sign-out-alt mb-1 text-xl"></i> Pulang
                    </button>
                </div>
                <button onclick="bukaModalIzin()" class="w-full bg-amber-500 text-white py-3 rounded-2xl font-bold shadow-md hover:bg-amber-600 transition">
                    <i class="fas fa-envelope-open-text mr-2"></i> Ajukan Izin / Sakit
                </button>
            </div>
        </div>
    </div>

    <!-- === TAMPILAN ADMIN PANEL === -->
    <div id="viewAdmin" class="hidden min-h-screen bg-slate-100 pb-20">
        <div class="bg-teal-800 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-30">
            <h1 class="font-bold text-lg"><i class="fas fa-user-shield mr-2"></i>Admin Panel</h1>
            <button onclick="logoutAdmin()" class="bg-rose-600 px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-rose-700 transition">Logout</button>
        </div>

        <div class="p-4 space-y-6">
            <!-- Pengaturan Sistem (Jam & GPS) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-4 border-b pb-2"><i class="fas fa-cog mr-2"></i>Pengaturan Sistem</h3>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Jam Masuk (Batas Normal)</label>
                        <input type="time" id="setJamMasuk" class="w-full border rounded-lg p-2 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Jam Pulang (Minimal)</label>
                        <input type="time" id="setJamPulang" class="w-full border rounded-lg p-2 bg-slate-50">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Latitude Kantor</label>
                        <input type="text" id="setLat" class="w-full border rounded-lg p-2 bg-slate-50 text-sm" placeholder="-8.12345">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Longitude Kantor</label>
                        <input type="text" id="setLng" class="w-full border rounded-lg p-2 bg-slate-50 text-sm" placeholder="116.12345">
                    </div>
                </div>
                <button onclick="simpanPengaturan()" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold text-sm">Simpan Pengaturan</button>
            </div>

            <!-- Kelola Pegawai -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-4 border-b pb-2"><i class="fas fa-users-cog mr-2"></i>Kelola Pegawai</h3>
                
                <div class="bg-slate-50 p-3 rounded-xl mb-4 border">
                    <input type="text" id="addNama" placeholder="Nama Pegawai" class="w-full border rounded-lg p-2 mb-2 text-sm">
                    <select id="addJabatan" class="w-full border rounded-lg p-2 mb-2 text-sm">
                        <option value="Kepala Desa">Kepala Desa</option>
                        <option value="Sekretaris Desa">Sekretaris Desa</option>
                        <option value="Kasi Pemerintahan">Kasi Pemerintahan</option>
                        <option value="Kasi Kesejahteraan">Kasi Kesejahteraan</option>
                        <option value="Kasi Pelayanan">Kasi Pelayanan</option>
                        <option value="Kaur Keuangan">Kaur Keuangan</option>
                        <option value="Kaur Umum">Kaur Umum</option>
                        <option value="Kaur Perencanaan">Kaur Perencanaan</option>
                        <option value="Kepala Dusun">Kepala Dusun</option>
                        <option value="Staf Desa">Staf Desa</option>
                    </select>
                    <input type="url" id="addFoto" placeholder="URL Foto (Opsional)" class="w-full border rounded-lg p-2 mb-3 text-sm">
                    <button onclick="tambahPegawai()" class="w-full bg-teal-600 text-white py-2 rounded-lg font-bold text-sm">Tambah Pegawai</button>
                </div>

                <div id="listPegawaiAdmin" class="space-y-2 max-h-60 overflow-y-auto">
                    <!-- List Pegawai dimuat via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- === MODAL & OVERLAYS === -->

    <!-- Modal Login Admin -->
    <div id="modalLogin" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center">Login Admin</h2>
            <input type="email" id="loginEmail" placeholder="Email" class="w-full border p-3 rounded-lg mb-3">
            <input type="password" id="loginPass" placeholder="Password" class="w-full border p-3 rounded-lg mb-4">
            <button onclick="prosesLogin()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold mb-2">Login</button>
            <button onclick="tutupModal('modalLogin')" class="w-full text-slate-500 py-2">Batal</button>
        </div>
    </div>

    <!-- Modal Izin -->
    <div id="modalIzin" class="fixed inset-0 bg-slate-900 bg-opacity-75 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h2 class="text-lg font-bold mb-4">Pengajuan Izin</h2>
            <select id="izinTipe" class="w-full border p-3 rounded-lg mb-3">
                <option value="Sakit">Sakit</option>
                <option value="Izin Keluarga">Izin Keluarga</option>
                <option value="Izin Telat">Izin Terlambat</option>
                <option value="Dinas Luar">Dinas Luar</option>
            </select>
            <textarea id="izinKet" placeholder="Keterangan..." class="w-full border p-3 rounded-lg mb-4 h-24"></textarea>
            <button onclick="kirimIzin()" class="w-full bg-amber-500 text-white py-3 rounded-lg font-bold mb-2">Kirim Pengajuan</button>
            <button onclick="tutupModal('modalIzin')" class="w-full text-slate-500 py-2">Batal</button>
        </div>
    </div>

    <!-- Modal Fingerprint (Hold to Scan) -->
    <div id="modalFingerprint" class="fixed inset-0 bg-slate-900 bg-opacity-90 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center relative">
            <h2 class="text-xl font-bold text-slate-800 mb-2" id="tipeAbsenTitle">Verifikasi Sidik Jari</h2>
            <p class="text-xs text-slate-500 mb-8 h-8" id="statusScanText">Pastikan Anda berada di area kantor.</p>
            
            <div class="relative w-32 h-32 mx-auto mb-6">
                <svg class="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#E2E8F0" stroke-width="8"></circle>
                    <circle id="progressCircle" cx="50" cy="50" r="45" fill="none" stroke="#10B981" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283" class="transition-all duration-75"></circle>
                </svg>
                <button id="btnFingerprint" class="absolute inset-0 w-full h-full flex items-center justify-center text-5xl text-teal-600 bg-teal-50 rounded-full z-10 fingerprint-btn">
                    <i class="fas fa-fingerprint"></i>
                </button>
            </div>
            
            <p class="text-sm font-bold text-teal-600 animate-pulse mb-6">Tekan & Tahan untuk Presensi</p>
            <button onclick="tutupModal('modalFingerprint')" class="text-slate-400 font-semibold text-sm">Batal</button>
        </div>
    </div>

    <!-- === SCRIPT LOGIKA === -->
    <script>
        // 1. Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyASDR_J6OaYecrmecW92w9QmW-C0Ug5v74",
            authDomain: "absensi-2c20a.firebaseapp.com",
            projectId: "absensi-2c20a",
            storageBucket: "absensi-2c20a.firebasestorage.app",
            messagingSenderId: "370158710098",
            appId: "1:370158710098:web:50be176b4186e5c6fd1e8b"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 2. State Global
        let dataPegawai = [];
        let pengaturan = {
            jamMasuk: "08:00", jamPulang: "14:00",
            latKantor: -8.650000, lngKantor: 116.320000, radius: 50
        };
        let pegawaiAktif = null;
        let tipeAbsenAktif = "";

        // 3. Inisialisasi Data (Dengan Fallback Aman)
        async function initData() {
            try {
                // Ambil Pengaturan
                const docPengaturan = await db.collection("sistem").doc("pengaturan").get();
                if(docPengaturan.exists) {
                    pengaturan = { ...pengaturan, ...docPengaturan.data() };
                }
                
                // Ambil Data Pegawai
                db.collection("pegawai").onSnapshot((snapshot) => {
                    dataPegawai = [];
                    snapshot.forEach(doc => {
                        dataPegawai.push({ id: doc.id, ...doc.data() });
                    });
                    renderCarousel();
                    if(document.getElementById('viewAdmin').classList.contains('hidden') === false) {
                        renderListAdmin();
                    }
                }, (error) => {
                    console.error("Gagal memuat pegawai, menggunakan data kosong.", error);
                    document.getElementById('teksLoadingPegawai').innerText = "Belum ada data pegawai.";
                });

            } catch (error) {
                console.error("Firebase fetch error:", error);
                document.getElementById('teksLoadingPegawai').innerText = "Belum ada data. Hubungi Admin.";
            }
        }

        // 4. Render UI
        function renderCarousel() {
            const container = document.getElementById('carouselPegawai');
            container.innerHTML = '';
            if(dataPegawai.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 px-4">Belum ada pegawai terdaftar.</p>';
                return;
            }

            dataPegawai.forEach(p => {
                const isKades = p.jabatan === 'Kepala Desa';
                if(isKades) document.getElementById('fotoKadesPublik').src = p.foto || 'https://via.placeholder.com/150';

                const card = document.createElement('div');
                card.className = `min-w-[130px] p-4 rounded-2xl bg-white shadow-sm border flex flex-col items-center cursor-pointer transition ${pegawaiAktif?.id === p.id ? 'border-teal-500 bg-teal-50 ring-2 ring-teal-200' : 'border-slate-200'}`;
                card.onclick = () => pilihPegawai(p);
                
                const fotoUrl = p.foto || `https://ui-avatars.com/api/?name=${p.nama}&background=random`;
                card.innerHTML = `
                    <img src="${fotoUrl}" class="w-14 h-14 rounded-full object-cover mb-3 border shadow-sm">
                    <h4 class="text-xs font-bold text-center leading-tight mb-1 truncate w-full">${p.nama}</h4>
                    <span class="text-[10px] text-teal-700 bg-teal-100 px-2 py-0.5 rounded-full text-center whitespace-nowrap">${p.jabatan}</span>
                `;
                container.appendChild(card);
            });
        }

        function pilihPegawai(p) {
            pegawaiAktif = p;
            renderCarousel();
            document.getElementById('actionArea').classList.remove('hidden');
            document.getElementById('namaTerpilih').innerText = p.nama;
            document.getElementById('jabatanTerpilih').innerText = p.jabatan;
            document.getElementById('fotoTerpilih').src = p.foto || `https://ui-avatars.com/api/?name=${p.nama}&background=random`;
        }

        // 5. Logika Absensi & Hold to Scan
        function siapkanAbsen(tipe) {
            if(!pegawaiAktif) return alert("Pilih profil Anda terlebih dahulu.");
            
            // Validasi Jam Pulang
            const sekarang = new Date();
            const jamSekarang = sekarang.getHours().toString().padStart(2, '0') + ":" + sekarang.getMinutes().toString().padStart(2, '0');
            
            if(tipe === 'Pulang' && jamSekarang < pengaturan.jamPulang) {
                return alert(`Belum waktunya pulang! Jam pulang diatur minimal pukul ${pengaturan.jamPulang}`);
            }

            tipeAbsenAktif = tipe;
            document.getElementById('modalFingerprint').classList.remove('hidden');
            document.getElementById('tipeAbsenTitle').innerText = `Absen ${tipe}`;
            document.getElementById('statusScanText').innerText = "Tahan sidik jari untuk mencatat GPS...";
            
            setupHoldToScan();
        }

        function setupHoldToScan() {
            const btn = document.getElementById('btnFingerprint');
            const circle = document.getElementById('progressCircle');
            let holdTimer;
            let progressInterval;
            let progress = 0;

            const start = (e) => {
                e.preventDefault();
                progress = 0;
                circle.style.strokeDashoffset = 283;
                document.getElementById('statusScanText').innerText = "Memindai biometrik...";

                progressInterval = setInterval(() => {
                    progress += 2;
                    let offset = 283 - (283 * (progress/100));
                    circle.style.strokeDashoffset = offset < 0 ? 0 : offset;
                }, 30);

                holdTimer = setTimeout(() => {
                    clearInterval(progressInterval);
                    verifikasiGPSdanKirim();
                }, 1500); // Tahan 1.5 detik
            };

            const stop = () => {
                clearTimeout(holdTimer);
                clearInterval(progressInterval);
                progress = 0;
                circle.style.strokeDashoffset = 283;
                document.getElementById('statusScanText').innerText = "Pemindaian dibatalkan.";
            };

            // Hapus listener lama untuk mencegah duplikasi
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.addEventListener('mousedown', start);
            newBtn.addEventListener('mouseup', stop);
            newBtn.addEventListener('mouseleave', stop);
            newBtn.addEventListener('touchstart', start, {passive: false});
            newBtn.addEventListener('touchend', stop);
        }

        function verifikasiGPSdanKirim() {
            document.getElementById('statusScanText').innerText = "Memverifikasi Lokasi GPS...";
            
            if (!navigator.geolocation) {
                alert("GPS tidak didukung di perangkat ini.");
                tutupModal('modalFingerprint');
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const latPegawai = position.coords.latitude;
                const lngPegawai = position.coords.longitude;
                
                // Hitung jarak (Haversine Formula sederhana)
                const R = 6371e3; // radius bumi di meter
                const lat1 = pengaturan.latKantor * Math.PI/180;
                const lat2 = latPegawai * Math.PI/180;
                const dLat = (latPegawai - pengaturan.latKantor) * Math.PI/180;
                const dLng = (lngPegawai - pengaturan.lngKantor) * Math.PI/180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                const jarak = R * c;

                if(jarak > pengaturan.radius && pengaturan.latKantor !== 0) {
                    alert(`Gagal! Anda berada di luar jangkauan kantor. (Jarak: ${Math.round(jarak)}m)`);
                    tutupModal('modalFingerprint');
                } else {
                    simpanDataAbsen(latPegawai, lngPegawai);
                }
            }, (error) => {
                alert("Gagal mendapatkan lokasi GPS. Pastikan Izin Lokasi aktif.");
                tutupModal('modalFingerprint');
            });
        }

        async function simpanDataAbsen(lat, lng) {
            const sekarang = new Date();
            const jam = sekarang.getHours().toString().padStart(2, '0') + ":" + sekarang.getMinutes().toString().padStart(2, '0');
            const tgl = sekarang.toISOString().split('T')[0]; // YYYY-MM-DD
            
            let statusWaktu = "Tepat Waktu";
            if(tipeAbsenAktif === 'Masuk' && jam > pengaturan.jamMasuk) statusWaktu = "Terlambat";

            const dataToSave = {
                idPegawai: pegawaiAktif.id,
                nama: pegawaiAktif.nama,
                jabatan: pegawaiAktif.jabatan,
                tipe: tipeAbsenAktif,
                waktu: jam,
                tanggal: tgl,
                status: statusWaktu,
                lokasi: `${lat}, ${lng}`,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("absensi").add(dataToSave);
                alert(`Berhasil Presensi ${tipeAbsenAktif}! Status: ${statusWaktu}`);
                tutupModal('modalFingerprint');
            } catch (error) {
                console.error("Gagal menyimpan absensi:", error);
                alert("Terjadi kesalahan saat menyimpan data. Coba lagi.");
                tutupModal('modalFingerprint');
            }
        }

        // 6. Logika Admin
        function bukaModalLogin() {
            document.getElementById('modalLogin').classList.remove('hidden');
        }

        async function prosesLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                tutupModal('modalLogin');
                document.getElementById('viewPublik').classList.add('hidden');
                document.getElementById('viewAdmin').classList.remove('hidden');
                muatPengaturanAdmin();
                renderListAdmin();
            } catch (error) {
                alert("Login gagal: " + error.message);
            }
        }

        function logoutAdmin() {
            auth.signOut().then(() => {
                document.getElementById('viewAdmin').classList.add('hidden');
                document.getElementById('viewPublik').classList.remove('hidden');
            });
        }

        function muatPengaturanAdmin() {
            document.getElementById('setJamMasuk').value = pengaturan.jamMasuk;
            document.getElementById('setJamPulang').value = pengaturan.jamPulang;
            document.getElementById('setLat').value = pengaturan.latKantor;
            document.getElementById('setLng').value = pengaturan.lngKantor;
        }

        async function simpanPengaturan() {
            const data = {
                jamMasuk: document.getElementById('setJamMasuk').value,
                jamPulang: document.getElementById('setJamPulang').value,
                latKantor: parseFloat(document.getElementById('setLat').value),
                lngKantor: parseFloat(document.getElementById('setLng').value)
            };
            try {
                await db.collection("sistem").doc("pengaturan").set(data, {merge: true});
                alert("Pengaturan tersimpan!");
                pengaturan = { ...pengaturan, ...data };
            } catch (error) {
                alert("Gagal menyimpan pengaturan.");
            }
        }

        async function tambahPegawai() {
            const nama = document.getElementById('addNama').value;
            const jabatan = document.getElementById('addJabatan').value;
            const foto = document.getElementById('addFoto').value;
            
            if(!nama) return alert("Nama harus diisi!");
            try {
                await db.collection("pegawai").add({ nama, jabatan, foto });
                document.getElementById('addNama').value = '';
                document.getElementById('addFoto').value = '';
                alert("Pegawai ditambahkan!");
            } catch (error) {
                alert("Gagal menambah pegawai.");
            }
        }

        function renderListAdmin() {
            const container = document.getElementById('listPegawaiAdmin');
            container.innerHTML = '';
            dataPegawai.forEach(p => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-3 border rounded-lg">
                        <div>
                            <p class="font-bold text-sm">${p.nama}</p>
                            <p class="text-xs text-slate-500">${p.jabatan}</p>
                        </div>
                        <button onclick="hapusPegawai('${p.id}')" class="text-rose-500 hover:bg-rose-50 p-2 rounded">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        async function hapusPegawai(id) {
            if(confirm("Yakin hapus pegawai ini?")) {
                await db.collection("pegawai").doc(id).delete();
            }
        }

        // 7. Utilitas
        function tutupModal(id) {
            document.getElementById(id).classList.add('hidden');
        }
        function bukaModalIzin() {
            if(!pegawaiAktif) return alert("Pilih profil Anda terlebih dahulu.");
            document.getElementById('modalIzin').classList.remove('hidden');
        }
        async function kirimIzin() {
            const tipe = document.getElementById('izinTipe').value;
            const ket = document.getElementById('izinKet').value;
            const tgl = new Date().toISOString().split('T')[0];
            
            try {
                await db.collection("absensi").add({
                    idPegawai: pegawaiAktif.id,
                    nama: pegawaiAktif.nama,
                    jabatan: pegawaiAktif.jabatan,
                    tipe: "Izin",
                    status: tipe,
                    keterangan: ket,
                    tanggal: tgl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Pengajuan berhasil dikirim.");
                tutupModal('modalIzin');
            } catch (e) {
                alert("Gagal mengirim pengajuan.");
            }
        }

        // Mulai aplikasi
        window.onload = initData;
    </script>
</body>
</html>
