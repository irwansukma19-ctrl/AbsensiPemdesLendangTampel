<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<title>Absensi Pemdes Lendang Tampel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050816; --navy:#0a1128; --navy2:#101a3a; --line:rgba(212,175,55,.22);
  --gold:#d9b44a; --gold2:#f6e08f; --gold3:#a67c1d; --text:#f1ecdc; --mute:#9aa3bd;
  --ok:#3ddc97; --warn:#ffb347; --bad:#ff6b6b;
  --goldgrad:linear-gradient(135deg,#f6e08f 0%,#d9b44a 45%,#a67c1d 100%);
  --serif:'Cormorant Garamond',Georgia,serif; --display:'Cinzel',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--text);background:radial-gradient(1200px 700px at 80% -10%,#1b2a5e 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#2a1d4f 0%,transparent 55%),var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#dust{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 18px 110px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* kartu kaca */
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
.card h3{font-family:var(--serif);font-weight:600;font-size:24px;margin-bottom:4px}
.sub{color:var(--mute);font-size:13.5px;line-height:1.5}
.goldtxt{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
header.top{display:flex;align-items:center;gap:14px;padding:10px 0 22px}
.crest{width:54px;height:54px;flex:none;filter:drop-shadow(0 6px 18px rgba(217,180,74,.35))}
.brand{line-height:1.1}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em}
.brand span{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:17px}
.spacer{flex:1}
.who{text-align:right;font-size:13px}
.who b{display:block;font-weight:600}
.who span{color:var(--mute);font-size:12px}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 15px;border-radius:999px;font-size:13px;transition:.2s}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn-gold{background:var(--goldgrad);color:#2a1d00;border:0;padding:13px 22px;border-radius:14px;font-weight:700;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(217,180,74,.6);transition:transform .15s,box-shadow .2s}
.btn-gold:hover{transform:translateY(-1px)}
.btn-gold:disabled{opacity:.55;cursor:wait}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn-danger{background:transparent;border:1px solid rgba(255,107,107,.4);color:var(--bad);padding:8px 13px;border-radius:10px;font-size:12.5px}

/* nav */
nav.tabs{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:999px;background:rgba(10,17,40,.7);backdrop-filter:blur(12px);width:max-content;max-width:100%;margin-bottom:24px;overflow-x:auto}
nav.tabs button{background:transparent;border:0;color:var(--mute);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.2s}
nav.tabs button.on{background:var(--goldgrad);color:#2a1d00}
@media(max-width:760px){
  nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;margin:0;z-index:20;justify-content:space-around;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  nav.tabs button{padding:10px 12px;font-size:12.5px}
  .who{display:none}
}

/* form */
label{display:block;font-size:12.5px;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;background:rgba(5,8,22,.6);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:13px 14px;border-radius:12px;font:inherit;font-size:14.5px;transition:border .2s}
input:focus,select:focus{border-color:var(--gold);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}

/* login */
.auth-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;min-height:calc(100vh - 60px)}
@media(max-width:860px){.auth-grid{grid-template-columns:1fr;min-height:0;padding-top:10px}}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.05;letter-spacing:.03em}
.hero h1 em{display:block;font-family:var(--serif);font-weight:500;font-style:italic;font-size:.62em;letter-spacing:0;margin-top:10px}
.hero p{font-family:var(--serif);font-size:21px;color:#cfc8b4;margin-top:22px;max-width:520px;line-height:1.45}
.ornament{display:flex;align-items:center;gap:12px;margin:24px 0 0;color:var(--gold)}
.ornament i{height:1px;width:80px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.seg{display:flex;background:rgba(5,8,22,.6);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:6px}
.seg button{flex:1;background:transparent;border:0;color:var(--mute);padding:10px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:var(--goldgrad);color:#2a1d00}
.err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

/* beranda */
.grid-home{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media(max-width:860px){.grid-home{grid-template-columns:1fr}}
.clock{font-family:var(--display);font-weight:500;font-size:clamp(44px,9vw,76px);letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.date{font-family:var(--serif);font-size:20px;color:var(--gold);margin-top:8px;font-style:italic}
.hello{font-family:var(--serif);font-size:22px;color:#d8d2c0;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.stat{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(5,8,22,.45)}
.stat small{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
.stat b{font-family:var(--display);font-size:19px;font-weight:500}
.chip{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.chip.ok{background:rgba(61,220,151,.13);color:var(--ok)}
.chip.warn{background:rgba(255,179,71,.13);color:var(--warn)}
.chip.bad{background:rgba(255,107,107,.13);color:var(--bad)}
.chip.mute{background:rgba(255,255,255,.07);color:var(--mute)}

/* tombol sidik jari */
.scanwrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.fp{position:relative;width:176px;height:176px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#1d2c5e,#0a1128 70%);color:var(--gold2);display:grid;place-items:center;
  box-shadow:0 0 0 1px var(--line),0 0 0 10px rgba(217,180,74,.06),0 0 0 22px rgba(217,180,74,.03),0 30px 60px -20px rgba(217,180,74,.35);transition:transform .2s}
.fp:hover:not(:disabled){transform:scale(1.03)}
.fp svg{width:84px;height:84px}
.fp::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:rgba(217,180,74,.3);animation:spin 5s linear infinite}
.fp.scan::before{animation-duration:.9s;border-top-color:var(--gold2)}
.fp .beam{position:absolute;left:22%;right:22%;height:3px;border-radius:3px;background:var(--goldgrad);box-shadow:0 0 16px 4px rgba(246,224,143,.7);opacity:0;top:28%}
.fp.scan .beam{opacity:1;animation:beam 1.2s ease-in-out infinite alternate}
.fp.done{color:var(--ok)}
.fp:disabled{cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beam{from{top:26%}to{top:72%}}
.fp-label{font-family:var(--serif);font-size:24px;font-weight:600;margin-top:26px}
.fp-hint{color:var(--mute);font-size:13px;margin-top:4px;text-align:center;max-width:300px;line-height:1.5}

/* radar */
.radar{display:flex;gap:18px;align-items:center}
.radar svg{width:170px;height:170px;flex:none}
.radar .info b{font-family:var(--display);font-size:26px;font-weight:500;display:block;margin:2px 0 8px}
@media(max-width:520px){.radar{flex-direction:column;align-items:flex-start}}

/* tabel */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
th{font-family:var(--serif);font-size:15px;text-align:left;color:var(--gold);padding:13px 14px;background:rgba(5,8,22,.5);font-weight:600}
td{padding:13px 14px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.025)}
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.toolbar>div{min-width:170px}
.toolbar label{margin-top:0}
.empty{padding:36px;text-align:center;color:var(--mute);font-family:var(--serif);font-size:19px}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid rgba(255,255,255,.07)}
.list .item:first-child{border-top:0}
.list .d{font-family:var(--serif);font-size:18px}
.list .t{color:var(--mute);font-size:12.5px;margin-top:3px}

/* toast + overlay */
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:#0f1836;border:1px solid var(--gold);color:var(--text);padding:13px 20px;border-radius:14px;z-index:60;max-width:90vw;font-size:14px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 20px 50px rgba(0,0,0,.6)}
#toast.show{transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)}
#success{position:fixed;inset:0;z-index:50;background:rgba(3,5,14,.82);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
#success .box{text-align:center;max-width:380px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
#success svg{width:110px;height:110px}
#success circle{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .8s .1s forwards}
#success path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .7s forwards}
#success h2{font-family:var(--display);font-size:26px;margin:18px 0 6px}
#success p{color:var(--mute);line-height:1.6;margin-bottom:22px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.steps{counter-reset:s;margin-top:14px}
.steps li{margin:10px 0 10px 22px;color:#d8d2c0;line-height:1.6;font-size:14.5px}
code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px;font-size:12.5px;color:var(--gold2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="wrap" id="root"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
/* ============================================================
   1. KONFIGURASI FIREBASE  ->  ganti dengan milik Anda
   Firebase Console > Project settings > Your apps > Web app
   ============================================================ */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBrAE6g0iGKvr1C_vVdRmeAaUqGV2wE3Go",
  authDomain: "pawon-desain.firebaseapp.com",
  projectId: "pawon-desain",
  storageBucket: "pawon-desain.firebasestorage.app",
  messagingSenderId: "621979256906",
  appId: "1:621979256906:web:10b0334e7c12ead5e93eb3",
  measurementId: "G-96DLWXVDC5"
};
/* Pengaturan awal kantor (bisa diubah admin di menu Pengaturan) */
const DEFAULT_OFFICE = {
  nama: "Kantor Desa Lendang Tampel",
  lat: -8.6500, lng: 116.5200,     // GANTI lewat menu Pengaturan > "Gunakan lokasi saya"
  radius: 100,                     // meter
  maxAkurasi: 100,                 // meter, GPS lebih kasar dari ini ditolak
  jamMasuk: "07:30",               // lewat jam ini = Terlambat
  jamPulang: "15:00"
};

/* ============================================================
   2. UTILITAS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hms = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const tglPanjang = d => d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const tglPendek = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("id-ID", {weekday:"short", day:"numeric", month:"short", year:"numeric"}); };
const fmtJarak = m => m >= 1000 ? (m/1000).toFixed(2) + " km" : Math.round(m) + " m";
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371000, r = x => x * Math.PI / 180;
  const a = Math.sin(r(lat2-lat1)/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lng2-lng1)/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
let toastTimer;
function toast(msg, bad){
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", 4200);
}
function badge(status){
  if(!status) return '<span class="chip mute">Belum absen</span>';
  return `<span class="chip ${status === "Hadir" ? "ok" : "warn"}">${esc(status)}</span>`;
}
function authError(e){
  const m = {
    "auth/invalid-credential":"Email atau kata sandi salah.",
    "auth/wrong-password":"Email atau kata sandi salah.",
    "auth/user-not-found":"Akun tidak ditemukan. Silakan daftar terlebih dahulu.",
    "auth/email-already-in-use":"Email sudah terdaftar. Silakan masuk.",
    "auth/weak-password":"Kata sandi minimal 6 karakter.",
    "auth/invalid-email":"Format email tidak valid.",
    "auth/too-many-requests":"Terlalu banyak percobaan. Coba lagi beberapa menit lagi.",
    "auth/network-request-failed":"Tidak ada koneksi internet."
  };
  return m[e.code] || e.message;
}

/* ============================================================
   3. PARTIKEL EMAS (latar)
   ============================================================ */
(function(){
  const c = $("#dust"), x = c.getContext("2d"); let W, H, P = [];
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  size(); addEventListener("resize", size);
  for(let i = 0; i < 55; i++) P.push({x:Math.random()*2000, y:Math.random()*1200, r:Math.random()*1.6+.3, v:Math.random()*.25+.05, a:Math.random()*.5+.15});
  (function loop(){
    x.clearRect(0, 0, W, H);
    for(const p of P){
      p.y -= p.v; if(p.y < -5){ p.y = H + 5; p.x = Math.random()*W; }
      x.beginPath(); x.arc(p.x % W, p.y, p.r, 0, 6.283); x.fillStyle = `rgba(246,224,143,${p.a})`; x.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ============================================================
   4. ELEMEN VISUAL
   ============================================================ */
const CREST = `<svg class="crest" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e08f"/><stop offset=".5" stop-color="#d9b44a"/><stop offset="1" stop-color="#a67c1d"/></linearGradient></defs>
<path d="M32 4 56 13v18c0 15-10 25-24 29C18 56 8 46 8 31V13z" fill="#0a1128" stroke="url(#g)" stroke-width="2.4"/>
<path d="M32 12 49 18v13c0 10-7 17-17 21-10-4-17-11-17-21V18z" stroke="url(#g)" stroke-width="1.2" opacity=".6"/>
<path d="M32 20l3.4 7 7.6 1.1-5.5 5.4 1.3 7.6L32 37.4 25.2 41l1.3-7.6L21 28l7.6-1.1z" fill="url(#g)"/></svg>`;
const FP = `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M32 8c-13 0-22 9-22 21v6"/><path d="M32 14c-9.500 0-16 6.500-16 15v8c0 4-1 7-3 10"/><path d="M32 20c-6 0-10 4-10 9v9c0 6-2 10-5 14"/><path d="M32 26c-2.500 0-4 1.800-4 4v9c0 7-2 12-5 16"/><path d="M32 32v8c0 8-1.500 13-4 18"/><path d="M38 28c0-3-2.500-6-6-6"/><path d="M44 31v-3c0-7-5-14-12-14"/><path d="M38 34v8c0 6 1 10 3 14"/><path d="M44 38v6c0 5 1 8 2 11"/><path d="M50 22c-3-8-10-14-18-14"/><path d="M52 31c0-3-.5-6-1.500-8.500"/><path d="M50 40v6"/></svg>`;

/* ============================================================
   5. STATE & INISIALISASI FIREBASE
   ============================================================ */
let auth, db, me = null, profile = null, office = {...DEFAULT_OFFICE};
let view = "home", todayDoc = null, lastPos = null, watchId = null, clockTimer = null, busy = false;
let unsubToday = null, unsubOffice = null, allUsers = [];
const configured = !firebaseConfig.apiKey.startsWith("ISI");
const root = $("#root");

if(configured){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(async u => {
    if(registering) return;
    if(!u){ cleanup(); me = profile = null; return renderAuth("login"); }
    await boot(u);
  });
} else renderSetup();

let registering = false;
function cleanup(){
  unsubToday && unsubToday(); unsubOffice && unsubOffice();
  unsubToday = unsubOffice = null;
  if(watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(clockTimer); lastPos = null; todayDoc = null;
}
async function boot(u){
  me = u;
  const ref = db.collection("users").doc(u.uid);
  let snap = await ref.get();
  if(!snap.exists){
    await ref.set({uid:u.uid, email:u.email, nama:u.displayName || u.email.split("@")[0], nip:"", jabatan:"Perangkat Desa", role:"pegawai", credId:null, dibuat:firebase.firestore.FieldValue.serverTimestamp()});
    snap = await ref.get();
  }
  profile = snap.data();
  unsubOffice = db.collection("settings").doc("kantor").onSnapshot(s => { if(s.exists) office = {...DEFAULT_OFFICE, ...s.data()}; if(view === "home") updateRadar(); });
  unsubToday = db.collection("absensi").doc(`${u.uid}_${ymd(new Date())}`).onSnapshot(s => { todayDoc = s.exists ? s.data() : null; if(view === "home") vHome(); });
  startWatch();
  renderShell(); go("home");
}

/* ============================================================
   6. HALAMAN: SETUP, LOGIN, DAFTAR
   ============================================================ */
function renderSetup(){
  root.innerHTML = `<header class="top">${CREST}<div class="brand"><b>ABSENSI PEMDES</b><span>Lendang Tampel</span></div></header>
  <div class="card" style="max-width:720px;margin:20px auto">
    <h3>Hubungkan ke Firebase</h3>
    <p class="sub">Website sudah siap. Tinggal isi konfigurasi Firebase Anda agar login dan data absensi tersimpan.</p>
    <ol class="steps">
      <li>Buka <b>Firebase Console</b>, buat project, lalu tambahkan <b>Web app</b>.</li>
      <li>Salin <code>firebaseConfig</code> ke bagian atas file <code>index.html</code>.</li>
      <li>Aktifkan <b>Authentication</b> &rarr; metode <b>Email/Password</b>.</li>
      <li>Buat <b>Firestore Database</b>, lalu tempel isi <code>firestore.rules</code> di tab Rules.</li>
      <li>Deploy ke <b>Firebase Hosting</b> (wajib HTTPS agar GPS dan sidik jari berfungsi).</li>
    </ol>
  </div>`;
}

function renderAuth(mode){
  const reg = mode === "register";
  root.innerHTML = `<div class="auth-grid">
    <section class="hero">

/* ============================================================
   8. GPS & RADAR
   ============================================================ */
function startWatch(){
  if(!navigator.geolocation || watchId != null) return;
  watchId = navigator.geolocation.watchPosition(p => { lastPos = p; updateRadar(); },
    e => { lastPos = null; updateRadar(e); }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function getPos(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej(new Error("Perangkat tidak mendukung GPS."));
    navigator.geolocation.getCurrentPosition(res, e => rej(new Error(
      e.code === 1 ? "Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser." :
      e.code === 2 ? "Lokasi tidak tersedia. Pastikan GPS menyala." : "Waktu pencarian GPS habis. Coba lagi di area terbuka.")),
      {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  });
}
function radarSVG(dx, dy, inside){
  return `<svg viewBox="0 0 170 170"><defs><radialGradient id="rg"><stop offset="0" stop-color="#d9b44a" stop-opacity=".18"/><stop offset="1" stop-color="#d9b44a" stop-opacity="0"/></radialGradient></defs>
  <circle cx="85" cy="85" r="80" fill="url(#rg)" stroke="rgba(217,180,74,.5)"/>
  <circle cx="85" cy="85" r="53" fill="none" stroke="rgba(217,180,74,.18)" stroke-dasharray="3 5"/>
  <circle cx="85" cy="85" r="26" fill="none" stroke="rgba(217,180,74,.18)" stroke-dasharray="3 5"/>
  <path d="M85 5v160M5 85h160" stroke="rgba(217,180,74,.12)"/>
  <path d="M85 85 L85 5 A80 80 0 0 1 142 28Z" fill="rgba(246,224,143,.1)"><animateTransform attributeName="transform" type="rotate" from="0 85 85" to="360 85 85" dur="5s" repeatCount="indefinite"/></path>
  <circle cx="85" cy="85" r="5" fill="#f6e08f"/>
  ${dx == null ? "" : `<circle cx="${85 + dx}" cy="${85 + dy}" r="7" fill="${inside ? "#3ddc97" : "#ff6b6b"}" stroke="#050816" stroke-width="2"/>`}</svg>`;
}
function updateRadar(err){
  const box = $("#radar"); if(!box) return;
  if(!lastPos){
    box.innerHTML = `${radarSVG()}<div class="info"><span class="chip mute">${err ? "GPS bermasalah" : "Mencari lokasi..."}</span><b>--</b><p class="sub">${err ? esc(err.code === 1 ? "Izin lokasi ditolak." : "Lokasi belum tersedia.") : "Menunggu sinyal GPS."}</p></div>`;
    return;
  }
  const {latitude:la, longitude:lo, accuracy} = lastPos.coords;
  const jarak = haversine(la, lo, office.lat, office.lng);
  const inside = jarak <= office.radius;
  const R = 74, sc = Math.min(jarak, office.radius * 2) / (office.radius * 2) * R;
  const mx = (lo - office.lng) * 111320 * Math.cos(office.lat * Math.PI/180), my = (la - office.lat) * 110540;
  const n = Math.hypot(mx, my) || 1;
  const accOk = accuracy <= office.maxAkurasi;
  box.innerHTML = `${radarSVG(mx/n*sc, -my/n*sc, inside)}<div class="info">
    <span class="chip ${inside ? "ok" : "bad"}">${inside ? "Dalam area kantor" : "Di luar area kantor"}</span>
    <b>${fmtJarak(jarak)}</b>
    <p class="sub">Radius absen ${office.radius} m.<br>Akurasi GPS &plusmn;${Math.round(accuracy)} m ${accOk ? "" : '<span style="color:var(--warn)">(kurang presisi)</span>'}</p></div>`;
}

/* ============================================================
   9. SIDIK JARI (WebAuthn - sensor perangkat)
   ============================================================ */
const webauthnOk = () => !!(window.PublicKeyCredential && navigator.credentials);
async function daftarSidikJari(){
  if(!webauthnOk()) throw new Error("Browser ini tidak mendukung sidik jari. Gunakan Chrome/Safari terbaru lewat HTTPS.");
  const cred = await navigator.credentials.create({publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: {name:"Absensi Pemdes Lendang Tampel", id:location.hostname},
    user: {id:new TextEncoder().encode(me.uid), name:me.email, displayName:profile.nama},
    pubKeyCredParams: [{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
    authenticatorSelection: {authenticatorAttachment:"platform", userVerification:"required", residentKey:"discouraged"},
    timeout: 60000, attestation: "none"
  }});
  const credId = b64(cred.rawId);
  await db.collection("users").doc(me.uid).update({credId, credDaftar:firebase.firestore.FieldValue.serverTimestamp()});
  profile.credId = credId;
}
async function verifikasiSidikJari(){
  if(!webauthnOk()) throw new Error("Browser ini tidak mendukung sidik jari.");
  const a = await navigator.credentials.get({publicKey:{
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rpId: location.hostname, timeout: 60000, userVerification: "required",
    allowCredentials: [{type:"public-key", id:unb64(profile.credId), transports:["internal"]}]
  }});
  if(!a) throw new Error("Verifikasi sidik jari dibatalkan.");
}
const fpError = e => e.name === "NotAllowedError" ? "Verifikasi sidik jari dibatalkan atau gagal. Coba lagi." :
  e.name === "InvalidStateError" ? "Sidik jari sudah terdaftar di perangkat ini." : e.message;

/* ============================================================
   10. PROSES ABSEN
   ============================================================ */
async function doAbsen(jenis){
  if(busy) return; busy = true;
  const btn = $("#fp"); btn.classList.add("scan"); btn.disabled = true;
  $("#fpl").textContent = "Memeriksa lokasi...";
  try{
    const pos = await getPos();
    const {latitude:lat, longitude:lng, accuracy} = pos.coords;
    const jarak = haversine(lat, lng, office.lat, office.lng);
    if(accuracy > office.maxAkurasi) throw new Error(`Akurasi GPS rendah (±${Math.round(accuracy)} m). Pindah ke area terbuka atau aktifkan mode GPS presisi tinggi.`);
    if(jarak > office.radius) throw new Error(`Anda ${fmtJarak(jarak)} dari kantor, di luar radius ${office.radius} m.`);
    $("#fpl").textContent = "Tempelkan jari pada sensor...";
    await verifikasiSidikJari();

    const now = new Date(), tanggal = ymd(now), jam = hms(now);
    const ref = db.collection("absensi").doc(`${me.uid}_${tanggal}`);
    const cur = (await ref.get()).data() || {};
    const rec = {jam, lat, lng, jarak:Math.round(jarak), akurasi:Math.round(accuracy), ts:firebase.firestore.FieldValue.serverTimestamp()};
    let status;
    if(jenis === "masuk"){
      if(cur.masuk) throw new Error("Anda sudah absen masuk hari ini.");
      status = jam.slice(0,5) > office.jamMasuk ? "Terlambat" : "Hadir";
      await ref.set({uid:me.uid, nama:profile.nama, nip:profile.nip || "", jabatan:profile.jabatan, tanggal, masuk:rec, status}, {merge:true});
    } else {
      if(!cur.masuk) throw new Error("Belum ada absen masuk hari ini.");
      if(cur.pulang) throw new Error("Anda sudah absen pulang hari ini.");
      await ref.update({pulang:rec});
    }
    showSuccess(jenis, jam, status);
  }catch(e){
    toast(fpError(e), true);
  }finally{
    busy = false;
    const b = $("#fp"); if(b){ b.classList.remove("scan"); b.disabled = false; }
    if(view === "home") vHome();
  }
}
function showSuccess(jenis, jam, status){
  const d = document.createElement("div"); d.id = "success";
  d.innerHTML = `<div class="box"><svg viewBox="0 0 110 110" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="55" cy="55" r="48"/><path d="M34 57l15 15 28-31"/></svg>
    <h2 class="goldtxt">Absen ${jenis} berhasil</h2>
    <p>Pukul ${jam.slice(0,5)} WITA${status ? ` &middot; <b>${status}</b>` : ""}<br>Lokasi dan sidik jari Anda telah terverifikasi.</p>
    <button class="btn-gold" id="ok">Selesai</button></div>`;
  document.body.appendChild(d); $("#ok").onclick = () => d.remove();
}

function vHome(){

  else if(!d.masuk){ mode = "masuk"; label = "Absen masuk"; hint = `Batas tepat waktu pukul ${office.jamMasuk}. Anda harus berada dalam radius ${office.radius} m.`; }
  else if(!d.pulang){ mode = "pulang"; label = "Absen pulang"; hint = `Jam pulang mulai ${office.jamPulang}.`; }
  else { mode = "selesai"; label = "Absensi hari ini selesai"; hint = "Terima kasih atas pengabdian Anda hari ini."; }
  const jam = new Date().getHours();
  const sapa = jam < 11 ? "Selamat pagi" : jam < 15 ? "Selamat siang" : jam < 18 ? "Selamat sore" : "Selamat malam";
  $("#view").innerHTML = `<div class="grid-home">
    <section class="card">
      <div class="hello">${sapa}, ${esc(profile.nama.split(" ")[0])}</div>
      <div class="clock" id="clock">--:--:--</div><div class="date" id="date"></div>
      <div class="stats">

        <div class="stat"><small>Pulang</small><b>${d.pulang ? d.pulang.jam.slice(0,5) : "--:--"}</b></div>
        <div class="stat"><small>Status</small>${badge(d.status)}</div>
      </div>
      <div style="margin-top:26px"><h3 style="font-size:20px;margin-bottom:12px">Posisi Anda</h3><div class="radar" id="radar"></div></div>
    </section>
    <section class="card scanwrap">
      <button class="fp ${mode === "selesai" ? "done" : ""}" id="fp" ${mode === "selesai" ? "disabled" : ""} aria-label="${label}">${FP}<span class="beam"></span></button>
      <div class="fp-label goldtxt" id="fpl">${label}</div>
      <p class="fp-hint">${hint}</p>
    </section></div>`;
  const tick = () => { const n = new Date(); const c = $("#clock"); if(c){ c.textContent = hms(n); $("#date").textContent = tglPanjang(n); } };
  tick(); clockTimer = setInterval(tick, 1000); updateRadar();
  $("#fp").onclick = async () => {
    if(mode === "daftar"){
      const b = $("#fp"); b.classList.add("scan"); b.disabled = true;
      try{ await daftarSidikJari(); toast("Sidik jari berhasil didaftarkan."); }
      catch(e){ toast(fpError(e), true); }
      vHome();
    } else if(mode !== "selesai") doAbsen(mode);
  };
}

function vSetelan(){
  const o = office;
  $("#view").innerHTML = `<div class="card" style="max-width:640px"><h3>Pengaturan Kantor</h3><p class="sub">Titik lokasi dan jam kerja yang dipakai untuk memeriksa absensi.</p>
    <form id="sf"><label>Nama kantor</label><input id="s-nama" value="${esc(o.nama)}" required>
    <div class="row2"><div><label>Latitude</label><input id="s-lat" type="number" step="any" value="${o.lat}" required></div><div><label>Longitude</label><input id="s-lng" type="number" step="any" value="${o.lng}" required></div></div>
    <button type="button" class="btn-ghost btn-sm" id="here" style="margin-top:10px">Gunakan lokasi saya saat ini</button>
    <div class="row2"><div><label>Radius absen (meter)</label><input id="s-rad" type="number" min="10" value="${o.radius}" required></div><div><label>Akurasi GPS maksimal (meter)</label><input id="s-acc" type="number" min="10" value="${o.maxAkurasi}" required></div></div>
    <div class="row2"><div><label>Jam masuk (batas tepat waktu)</label><input id="s-in" type="time" value="${o.jamMasuk}" required></div><div><label>Jam pulang</label><input id="s-out" type="time" value="${o.jamPulang}" required></div></div>
    <button class="btn-gold" style="margin-top:22px">Simpan pengaturan</button></form></div>`;
  $("#here").onclick = async () => { try{ const p = await getPos(); $("#s-lat").value = p.coords.latitude.toFixed(6); $("#s-lng").value = p.coords.longitude.toFixed(6); toast("Lokasi terisi. Jangan lupa simpan."); }catch(e){ toast(e.message, true); } };
  $("#sf").onsubmit = async e => {
    e.preventDefault();
    const data = {nama:$("#s-nama").value.trim(), lat:parseFloat($("#s-lat").value), lng:parseFloat($("#s-lng").value), radius:+$("#s-rad").value, maxAkurasi:+$("#s-acc").value, jamMasuk:$("#s-in").value, jamPulang:$("#s-out").value};
    try{ await db.collection("settings").doc("kantor").set(data); toast("Pengaturan disimpan."); }catch(err){ toast(err.message, true); }
  };
}
</script>
</body>
</html>
